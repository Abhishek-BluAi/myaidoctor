version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://myaidoctor:myaidoctor_pass@db:5432/myaidoctor_db?schema=public
      - NODE_OPTIONS=--dns-result-order=ipv4first

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: myaidoctor
      POSTGRES_PASSWORD: myaidoctor_pass
      POSTGRES_DB: myaidoctor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
