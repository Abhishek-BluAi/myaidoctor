services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://myaidoctor:myaidoctor_pass@db:5432/myaidoctor_db?schema=public
      - NODE_OPTIONS=--dns-result-order=ipv4first
    networks:
      - myaidocnetwork

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: myaidoctor
      POSTGRES_PASSWORD: myaidoctor_pass
      POSTGRES_DB: myaidoctor_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - myaidocnetwork

volumes:
  postgres_data:

networks:
  myaidocnetwork:
    external: true
