services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=global-network"
      - "traefik.http.routers.myaidoctor.rule=Host(`myaidoc.bluai.ai`) || Host(`myaidoc.io`) || Host(`myaidoctor.io`) || Host(`myaidoc.ai`)"
      - "traefik.http.routers.myaidoctor.entrypoints=websecure"
      - "traefik.http.routers.myaidoctor.tls=true"
      - "traefik.http.routers.myaidoctor.tls.certresolver=cert-resolver"
      - "traefik.http.services.myaidoctor.loadbalancer.server.port=3000"
    networks:
      - global-network
networks:
  global-network:
    name: global-network
    external: true
