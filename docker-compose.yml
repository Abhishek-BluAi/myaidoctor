services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://myaidoctor:myaidoctor_pass@db:5432/myaidoctor_db?schema=public
      - NODE_OPTIONS=--dns-result-order=ipv4first
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=global-network"
      - "traefik.http.routers.myaidoctor.rule=Host(`myaidoc.ai`) || Host(`myaidoc.io`) || Host(`myaidoctor.io`) || Host(`myaidoc.bluai.ai`)"
      - "traefik.http.routers.myaidoctor.entrypoints=websecure"
      - "traefik.http.routers.myaidoctor.tls=true"
      - "traefik.http.routers.myaidoctor.tls.certresolver=cert-resolver"
      - "traefik.http.services.myaidoctor.loadbalancer.server.port=3000"
    networks:
      - global-network

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: myaidoctor
      POSTGRES_PASSWORD: myaidoctor_pass
      POSTGRES_DB: myaidoctor_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - global-network

volumes:
  postgres_data:

networks:
  global-network:
    name: global-network
    external: true
